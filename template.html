<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="{{ Description }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ Title }} | yaqyn">
    <meta property="og:description" content="{{ Description }}">
    <meta property="og:url" content="{{ Canonical }}">
    <meta property="og:site_name" content="yaqyn">
    <meta property="og:image" content="{{ ImageURL }}">
    <meta property="og:image:alt" content="Black and white portrait of Abdulrahman M. Yaqyn">
    <meta name="twitter:card" content="summary_large_image">
    <title>{{ Title }} | yaqyn</title>
    <link rel="canonical" href="{{ Canonical }}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="/index.css" rel="stylesheet">
  </head>
  <body class="{{ PageClass }}">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="yaqyn home">yaqyn<span>.</span></a>
        <nav aria-label="Main navigation">{{ Navigation }}</nav>
        <a class="header-link" href="https://github.com/yaqyn">GitHub <span aria-hidden="true">↗</span></a>
      </header>
      <main id="main" tabindex="-1">
        <div class="breadcrumbs">{{ Breadcrumbs }}</div>
        <article class="page-content">{{ Content }}</article>
      </main>
      <footer class="site-footer">
        <a class="wordmark" href="/">yaqyn<span>.</span></a>
        <p>Abdulrahman M. Yaqyn<br><span>Backend systems. AI applications. Linux.</span></p>
        <div><a href="/contact/">Get in touch</a><a href="https://github.com/yaqyn/folio-static-site">View source <span aria-hidden="true">↗</span></a></div>
      </footer>
    </div>
  </body>
</html>
