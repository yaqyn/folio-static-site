<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Leafmark</title><desc id="desc">A personal notebook. Capture, find, and keep your thoughts.</desc><rect width="1200" height="360" rx="20" fill="#edf1fa"/><rect x="800" y="50" width="280" height="275" rx="12" fill="#fff" stroke="#dce2ed" transform="rotate(5 940 188)"/><g fill="none" stroke="#dce2ed" stroke-width="2"><path d="M845 150h180M845 180h180M845 210h145M845 240h165"/></g><rect x="70" y="70" width="56" height="56" rx="15" fill="#365bc4"/><path d="M87 82h16l10 11v23H87z" fill="#fff"/><path d="M102 82v12h11" fill="#bbcafa"/><text x="145" y="112" font-family="system-ui,sans-serif" font-weight="700" font-size="42" fill="#202d45">leafmark.</text><text x="70" y="215" font-family="Georgia,serif" font-size="52" fill="#202d45">Keep what comes to mind.</text><text x="72" y="265" font-family="system-ui,sans-serif" font-size="22" fill="#61708a">Your personal notebook. A page of your own.</text></svg>
